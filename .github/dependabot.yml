version: 2
updates:
  # Dev dependencies only — the tool itself ships with none.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    ignore:
      # The types have to describe the oldest node we support, not the newest
      # one released — see `engines` in package.json.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
